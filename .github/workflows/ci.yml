name: CI - Integración Continua (Lint, Test, Build)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-check:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Validar Formato Prettier
        run: npm run format:check

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Verificación Estricta de Tipos TypeScript
        run: npm run type-check

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Ejecutar Tests con Cobertura (Vitest)
        run: npm run test:coverage

  build-validation:
    name: Build Next.js Production Standalone
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Compilar Next.js Standalone
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: npm run build
