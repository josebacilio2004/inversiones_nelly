version: '3.9'

# ====================================================================
# INVERSIONES NELLY S.A.C. - DOCKER COMPOSE ORQUESTACIÓN DE PRODUCCIÓN
# Servicios: PostgreSQL 16 + Redis 7 + Migrator + Next.js App + Nginx
# ====================================================================

services:
  # ------------------------------------------------------------------
  # 1. Base de Datos Relacional Unificada (PostgreSQL 16)
  # ------------------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: nelly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nelly_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-NellySecret2026!}
      POSTGRES_DB: ${DB_NAME:-inversiones_nelly_db}
      TZ: 'America/Lima'
    ports:
      - "${HOST_PORT_DB:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nelly_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nelly_admin} -d ${DB_NAME:-inversiones_nelly_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # 2. Caché y Lock de Habitaciones (Redis 7)
  # ------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: nelly_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-NellyRedis2026!}
    ports:
      - "${HOST_PORT_REDIS:-6385}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nelly_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-NellyRedis2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------------
  # 3. Servicio Efímero de Migraciones y Seed (Prisma Migrator)
  # ------------------------------------------------------------------
  db_migrator:
    build:
      context: .
      target: builder
    container_name: nelly_migrator
    environment:
      DATABASE_URL: postgresql://${DB_USER:-nelly_admin}:${DB_PASSWORD:-NellySecret2026!}@postgres_db:5432/${DB_NAME:-inversiones_nelly_db}?schema=public
    depends_on:
      postgres_db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts"
    networks:
      - nelly_network

  # ------------------------------------------------------------------
  # 4. Aplicación Web Next.js 15 (App Router Standalone)
  # ------------------------------------------------------------------
  web_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nelly_nextjs_app
    restart: unless-stopped
    ports:
      - "${HOST_PORT_APP:-3005}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-nelly_admin}:${DB_PASSWORD:-NellySecret2026!}@postgres_db:5432/${DB_NAME:-inversiones_nelly_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-NellyRedis2026!}@redis_cache:6379
      NEXT_PUBLIC_COMPANY_NAME: "Inversiones Nelly S.A.C."
      NEXT_PUBLIC_RUC: "20608945123"
      TZ: 'America/Lima'
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      db_migrator:
        condition: service_completed_successfully
    networks:
      - nelly_network

  # ------------------------------------------------------------------
  # 5. Reverse Proxy Nginx & Gateway de Seguridad
  # ------------------------------------------------------------------
  nginx_proxy:
    image: nginx:1.25-alpine
    container_name: nelly_nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT_HTTP:-8085}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web_app
    networks:
      - nelly_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nelly_network:
    driver: bridge
